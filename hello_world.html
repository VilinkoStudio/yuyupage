<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Hello ~</title>
    <script src="./source/js/tailwind.min.css"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000000;
            -webkit-tap-highlight-color: transparent;
        }

        #dotCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .control-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            z-index: 20;
            pointer-events: auto;
            font-family: system-ui, -apple-system, sans-serif;
            transition: opacity 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .control-bar label {
            color: #ccc;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            font-weight: 400;
            -webkit-tap-highlight-color: transparent;
        }

        .control-bar input {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 40px;
            padding: 8px 18px;
            color: #fff;
            font-size: 1rem;
            min-width: 180px;
            outline: none;
            transition: border 0.2s;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .control-bar input:focus {
            border-color: #7a7a7a;
        }

        .control-bar button {
            background: #2c2c2c;
            border: none;
            color: #f0f0f0;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            letter-spacing: 0.3px;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .control-bar button:hover {
            background: #3f3f3f;
        }

        .control-bar button:active {
            transform: scale(0.95);
        }

        @media (max-width: 640px) {
            .control-bar {
                padding: 10px 16px;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                width: 90%;
                border-radius: 30px;
            }

            .control-bar input {
                min-width: 120px;
                flex: 1;
            }
        }

        .no-click {
            cursor: default;
        }

        .control-bar.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="dotCanvas"></canvas>

    <div class="control-bar" id="controlBar">
        <label for="textInput">点阵文字</label>
        <input type="text" id="textInput" value="点阵" placeholder="输入任意文字或符号">
        <button id="renderBtn">渲染</button>
    </div>

    <script>
        (function () {
            const MODE = "debug"; // demo轮换模式/normal固定文本/design自由绘制/debug输入控制/loading加载动画

            const DEMO_CONTENTS = [
                "Hello", "你好", "Hola", "Bonjour", "Hallo", "Ciao", "Olá",
                "Привет", "مرحبا", "שלום", "Merhaba", "Salam",
                "Sawubona", "Jambo", "Hallå", "Hei", "Hej",
                "Tere", "Sveiki", "Labas", "Dzień dobry", "Ahoj",
                "Zdravo", "Здравей", "Salut", "Γεια σου", "Namaste",
                "నమస్కారం", "ನಮಸ್ಕಾರ", "வணக்கம்", "സ്വാഗതം", "সুপ্রভাত",
                "ਸਤ ਸ੍ਰੀ ਅਕਾਲ", "નમસ્કાર", "नमस्कार", "ନମସ୍କାର",
                "ສະບາຍດີ", "สวัสดี", "မင်္ဂလာပါ", "សួស្តី", "Xin chào",
                "こんにちは", "안녕하세요", "Aloha", "Kia ora",
                "Yá'át'ééh", "Bonjou", "Moni", "Mbote", "Habari",
                "Talofa", "Mālō", "Ni sa bula", "Aaniin", "Héllo"
            ];

            const canvas = document.getElementById('dotCanvas');
            const ctx = canvas.getContext('2d');

            const dotRadius = 3;
            const gap = 8;
            const offColor = "#121212";
            const onColor = "#ffffff";

            let cols, rows;
            let dotMatrix = [];

            const textInput = document.getElementById('textInput');
            const renderBtn = document.getElementById('renderBtn');
            const controlBar = document.getElementById('controlBar');

            const TABLET_MIN_WIDTH = 768;
            let mobileAlertShown = false;

            let loadingAnimationId = null;
            let loadingRadius = 0;
            let loadingMaxRadius = 0;
            let isAnimating = false;

            function isMobileOrTablet() {
                return window.innerWidth < TABLET_MIN_WIDTH;
            }

            function showMobileAlert() {
                if (!mobileAlertShown && isMobileOrTablet()) {
                    mobileAlertShown = true;
                    alert("请使用宽屏设备或电脑访问本页面。");
                }
            }

            function renderTextOnDots(text) {
                if (isMobileOrTablet()) {
                    text = "!";
                    showMobileAlert();
                }

                if (!text || text.length === 0) {
                    for (let y = 0; y < rows; y++) {
                        for (let x = 0; x < cols; x++) {
                            dotMatrix[y][x] = false;
                        }
                    }
                    drawGrid();
                    return;
                }

                const offscreen = document.createElement('canvas');
                offscreen.width = canvas.width;
                offscreen.height = canvas.height;
                const offCtx = offscreen.getContext('2d');

                offCtx.clearRect(0, 0, offscreen.width, offscreen.height);

                const maxWidth = canvas.width * 0.9;
                const maxHeight = canvas.height * 0.9;
                let fontSize = Math.min(canvas.width, canvas.height) * 0.3;
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'middle';

                const measureText = (size) => {
                    offCtx.font = `bold ${size}px "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif`;
                    const metrics = offCtx.measureText(text);
                    const textWidth = metrics.width;
                    const textHeight = size * 1.2;
                    return { width: textWidth, height: textHeight };
                };

                let bestSize = Math.min(canvas.width, canvas.height) * 0.4;
                let step = 2;
                let attempts = 0;
                for (let size = bestSize; size > 10; size -= step) {
                    const { width, height } = measureText(size);
                    if (width <= maxWidth && height <= maxHeight) {
                        bestSize = size;
                        break;
                    }
                    attempts++;
                    if (attempts > 200) break;
                }

                if (bestSize < 14) bestSize = 14;

                offCtx.font = `bold ${bestSize}px "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif`;
                const cx = offscreen.width / 2;
                const cy = offscreen.height / 2;
                offCtx.fillStyle = '#ffffff';
                offCtx.shadowColor = 'transparent';
                offCtx.fillText(text, cx, cy);

                const imageData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
                const data = imageData.data;

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const px = x * gap + gap / 2;
                        const py = y * gap + gap / 2;
                        const ix = Math.floor(px);
                        const iy = Math.floor(py);
                        if (ix < 0 || ix >= offscreen.width || iy < 0 || iy >= offscreen.height) {
                            dotMatrix[y][x] = false;
                            continue;
                        }
                        const index = (iy * offscreen.width + ix) * 4;
                        const isWhite = data[index] > 128;
                        dotMatrix[y][x] = isWhite;
                    }
                }

                drawGrid();
            }

            function drawGrid() {
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const px = x * gap + gap / 2;
                        const py = y * gap + gap / 2;
                        ctx.beginPath();
                        ctx.arc(px, py, dotRadius, 0, Math.PI * 2);
                        ctx.fillStyle = dotMatrix[y][x] ? onColor : offColor;
                        ctx.fill();
                    }
                }
            }

            function drawLoadingRipple() {
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const px = x * gap + gap / 2;
                        const py = y * gap + gap / 2;
                        const dx = px - centerX;
                        const dy = py - centerY;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        let isLit = false;
                        const ringWidth = 12;
                        if (dist <= loadingRadius && dist > loadingRadius - ringWidth) {
                            isLit = true;
                        }

                        ctx.beginPath();
                        ctx.arc(px, py, dotRadius, 0, Math.PI * 2);
                        ctx.fillStyle = isLit ? onColor : offColor;
                        ctx.fill();
                    }
                }
            }

            function startLoadingAnimation() {
                if (loadingAnimationId) {
                    cancelAnimationFrame(loadingAnimationId);
                    loadingAnimationId = null;
                }

                loadingRadius = 0;
                loadingMaxRadius = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height) / 2;
                isAnimating = true;

                function animateLoading() {
                    loadingRadius += 1.2;

                    if (loadingRadius > loadingMaxRadius + 30) {
                        loadingRadius = 0;
                        isAnimating = false;
                        drawGrid();
                        return;
                    }

                    drawLoadingRipple();
                    loadingAnimationId = requestAnimationFrame(animateLoading);
                }

                animateLoading();
            }

            function stopLoadingAnimation() {
                if (loadingAnimationId) {
                    cancelAnimationFrame(loadingAnimationId);
                    loadingAnimationId = null;
                }
                isAnimating = false;
            }

            let demoInterval = null;
            let currentDemoIndex = 0;

            function startDemoRotation() {
                if (demoInterval) {
                    clearInterval(demoInterval);
                    demoInterval = null;
                }
                currentDemoIndex = 0;
                if (DEMO_CONTENTS.length > 0) {
                    renderTextOnDots(DEMO_CONTENTS[0]);
                }
                demoInterval = setInterval(function () {
                    currentDemoIndex = (currentDemoIndex + 1) % DEMO_CONTENTS.length;
                    const nextText = DEMO_CONTENTS[currentDemoIndex];
                    renderTextOnDots(nextText);
                }, 2000);
            }

            function stopDemoRotation() {
                if (demoInterval) {
                    clearInterval(demoInterval);
                    demoInterval = null;
                }
            }

            function setupDesignMode() {
                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        dotMatrix[y][x] = false;
                    }
                }
                drawGrid();
            }

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                cols = Math.floor(canvas.width / gap);
                rows = Math.floor(canvas.height / gap);
                dotMatrix = Array(rows).fill().map(() => Array(cols).fill(false));

                if (MODE === "debug") {
                    const currentText = textInput.value || '点阵';
                    renderTextOnDots(currentText);
                } else if (MODE === "demo") {
                    if (!demoInterval) {
                        startDemoRotation();
                    } else {
                        const currentText = DEMO_CONTENTS[currentDemoIndex] || DEMO_CONTENTS[0];
                        renderTextOnDots(currentText);
                    }
                } else if (MODE === "design") {
                    setupDesignMode();
                } else if (MODE === "normal") {
                    renderTextOnDots("Hello ~");
                } else if (MODE === "loading") {
                    stopLoadingAnimation();
                    drawGrid();
                }
            }

            function handleCanvasClick(e) {
                if (MODE === "loading") {
                    if (!isAnimating) {
                        startLoadingAnimation();
                    }
                    return;
                }
                if (MODE !== "design") {
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const xIndex = Math.floor(mx / gap);
                const yIndex = Math.floor(my / gap);
                if (xIndex >= 0 && xIndex < cols && yIndex >= 0 && yIndex < rows) {
                    dotMatrix[yIndex][xIndex] = !dotMatrix[yIndex][xIndex];
                    drawGrid();
                }
            }

            canvas.addEventListener('mousedown', handleCanvasClick);

            window.addEventListener('resize', function () {
                resizeCanvas();
            });

            if (MODE === "debug") {
                controlBar.classList.remove('hidden');
                renderBtn.addEventListener('click', function () {
                    const text = textInput.value;
                    renderTextOnDots(text);
                    stopDemoRotation();
                });

                textInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        renderTextOnDots(textInput.value);
                        stopDemoRotation();
                        e.preventDefault();
                    }
                });

                textInput.addEventListener('blur', function () {
                    renderTextOnDots(textInput.value);
                    stopDemoRotation();
                });

                stopDemoRotation();
                stopLoadingAnimation();
            } else if (MODE === "demo") {
                controlBar.classList.add('hidden');
                stopDemoRotation();
                stopLoadingAnimation();
                startDemoRotation();
            } else if (MODE === "design") {
                controlBar.classList.add('hidden');
                stopDemoRotation();
                stopLoadingAnimation();
                setupDesignMode();
            } else if (MODE === "normal") {
                controlBar.classList.add('hidden');
                stopDemoRotation();
                stopLoadingAnimation();
                renderTextOnDots("Hello ~");
            } else if (MODE === "loading") {
                controlBar.classList.add('hidden');
                stopDemoRotation();
                stopLoadingAnimation();
                drawGrid();
            }

            resizeCanvas();

            setTimeout(() => {
                if (MODE === "debug") {
                    renderTextOnDots(textInput.value || '点阵');
                } else if (MODE === "demo") {
                    if (!demoInterval) {
                        startDemoRotation();
                    }
                } else if (MODE === "design") {
                    setupDesignMode();
                } else if (MODE === "normal") {
                    renderTextOnDots("Hello ~");
                } else if (MODE === "loading") {
                    drawGrid();
                }
            }, 20);

            window.renderTextOnDots = renderTextOnDots;
            window.MODE = MODE;
            window.startDemoRotation = startDemoRotation;
            window.stopDemoRotation = stopDemoRotation;
            window.setupDesignMode = setupDesignMode;
            window.startLoadingAnimation = startLoadingAnimation;
            window.stopLoadingAnimation = stopLoadingAnimation;
        })();
    </script>
</body>

</html>
