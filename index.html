<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Yuyupage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        .stage {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .gif-box {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
        }

        #studyCanvas {
            display: none;
        }

        #studyImg {
            max-width: 90vw;
            max-height: 70vh;
            height: auto;
            width: auto;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .caption {
            color: #555555;
            font-size: 0.8rem;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="stage">
        <div class="gif-box">
            <canvas id="studyCanvas"></canvas>
            <img id="studyImg" src="./source/study-1.gif" alt="">
        </div>
        <div class="caption" id="caption">加载中</div>
    </div>

    <script>
        (function() {
            const img = document.getElementById('studyImg');
            const caption = document.getElementById('caption');

            // 防止拖拽、右键等
            img.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
            window.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('copy', function(e) { e.preventDefault(); });
            document.addEventListener('cut', function(e) { e.preventDefault(); });
            document.addEventListener('dragstart', function(e) { e.preventDefault(); });
            window.addEventListener('keydown', function(e) {
                if (e.key === 'F11' || e.key === 'F12') e.preventDefault();
                if (e.ctrlKey || e.metaKey) {
                    const k = e.key.toLowerCase();
                    if (k === 'u' || k === 's' || k === 'c' || k === 'a') e.preventDefault();
                }
            });

            // 缓存管理
            const CACHE_KEY = 'gif_cache_paths';
            const CACHE_VERSION = 'v1';

            function saveToCache(studyUrl, dangerUrl) {
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify({
                        version: CACHE_VERSION,
                        timestamp: Date.now(),
                        studyUrl: studyUrl,
                        dangerUrl: dangerUrl
                    }));
                } catch (e) { /* ignore */ }
            }

            function loadFromCache() {
                try {
                    const raw = localStorage.getItem(CACHE_KEY);
                    if (!raw) return null;
                    const data = JSON.parse(raw);
                    if (data.version !== CACHE_VERSION) return null;
                    if (Date.now() - data.timestamp > 7 * 24 * 60 * 60 * 1000) {
                        localStorage.removeItem(CACHE_KEY);
                        return null;
                    }
                    if (!data.studyUrl || !data.dangerUrl) return null;
                    return data;
                } catch (e) { return null; }
            }

            // 预加载图片（返回 Promise）
            function preloadImage(url) {
                return new Promise(function(resolve, reject) {
                    const image = new Image();
                    image.onload = function() { resolve(url); };
                    image.onerror = function() { reject(new Error('Failed to load: ' + url)); };
                    image.src = url;
                });
            }

            let switched = false;          // 是否已切换到 danger
            let textTimer = null;
            let switchTimer = null;

            function clearTimers() {
                if (textTimer) { clearTimeout(textTimer); textTimer = null; }
                if (switchTimer) { clearTimeout(switchTimer); switchTimer = null; }
            }

            // 开始播放 study-1.gif 并启动计时
            function startStudyAndTimer() {
                img.src = './source/study-1.gif';
                caption.textContent = '加载中';
                switched = false;

                // 监听图片加载完成（如果已缓存，会立即触发）
                img.onload = function() {
                    // 加载完成，开始计时 12.4 秒
                    clearTimers();
                    textTimer = setTimeout(function() {
                        caption.textContent = '当前在您的国家或地区不可用';
                    }, 12400);

                    switchTimer = setTimeout(function() {
                        if (!switched) {
                            switched = true;
                            img.src = './source/danger2.gif';
                            // 切换后文本保持不变（已经是最终文本）
                        }
                    }, 12400);
                };

                // 如果图片已缓存，可能不会触发 onload？但现代浏览器会触发，为了保险，也可以检查 complete
                if (img.complete) {
                    // 如果已经完成，手动触发
                    img.onload && img.onload();
                }
            }

            // 初始化
            function init() {
                const cached = loadFromCache();
                if (cached) {
                    // 有缓存，直接使用 study-1.gif（可能已缓存，很快）
                    startStudyAndTimer();
                } else {
                    // 首次加载，预加载两个 GIF 后再开始
                    Promise.all([
                        preloadImage('./source/study-1.gif'),
                        preloadImage('./source/danger2.gif')
                    ]).then(function() {
                        saveToCache('./source/study-1.gif', './source/danger2.gif');
                        startStudyAndTimer();
                    }).catch(function(err) {
                        console.warn('预加载失败，直接尝试播放', err);
                        startStudyAndTimer();
                    });
                }
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }
        })();
    </script>
</body>

</html>
