<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuyupage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .container img {
            max-width: 100px;
            max-height: 100px;
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .footer-text {
            margin-top: 16px;
            color: #4a4a4a;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="main-image" src="" alt="img">
        <p class="footer-text">We Meet, Inspire, Create.</p>
    </div>

    <script>
        (function() {
            var CACHE_KEY = 'cached_image_data';
            var IMG_SRC = './source/3d-blocks-glass-geometric-blocks-in-orange-blue-and-clear-hues.png';
            var img = document.getElementById('main-image');

            var cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                img.src = cached;
                return;
            }

            var xhr = new XMLHttpRequest();
            xhr.open('GET', IMG_SRC, true);
            xhr.responseType = 'blob';
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var reader = new FileReader();
                    reader.onloadend = function() {
                        var base64 = reader.result;
                        localStorage.setItem(CACHE_KEY, base64);
                        img.src = base64;
                    };
                    reader.readAsDataURL(xhr.response);
                } else {
                    img.src = IMG_SRC;
                }
            };
            xhr.onerror = function() {
                img.src = IMG_SRC;
            };
            xhr.send();
        })();
    </script>
</body>
</html>
