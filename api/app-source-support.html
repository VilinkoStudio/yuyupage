<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F9F9FF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131317" media="(prefers-color-scheme: dark)">
    <title>Vilinko Studio 服务中心</title>
    <link href="./source/css/tailwind.min.css" rel="stylesheet" />
    <link href="./source/font-awesome/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': 'var(--primary)',
                        'on-primary': 'var(--on-primary)',
                        'primary-container': 'var(--primary-container)',
                        'on-primary-container': 'var(--on-primary-container)',
                        'secondary': 'var(--secondary)',
                        'secondary-container': 'var(--secondary-container)',
                        'on-secondary-container': 'var(--on-secondary-container)',
                        'tertiary-container': 'var(--tertiary-container)',
                        'on-tertiary-container': 'var(--on-tertiary-container)',
                        'surface': 'var(--surface)',
                        'surface-container-low': 'var(--surface-container-low)',
                        'surface-container': 'var(--surface-container)',
                        'surface-container-high': 'var(--surface-container-high)',
                        'surface-container-highest': 'var(--surface-container-highest)',
                        'on-surface': 'var(--on-surface)',
                        'on-surface-variant': 'var(--on-surface-variant)',
                        'outline': 'var(--outline)',
                        'outline-variant': 'var(--outline-variant)',
                        'inverse-surface': 'var(--inverse-surface)',
                        'inverse-on-surface': 'var(--inverse-on-surface)',
                        'inverse-primary': 'var(--inverse-primary)',
                        'error': 'var(--error)',
                        'on-error': 'var(--on-error)',
                        'error-container': 'var(--error-container)',
                        'on-error-container': 'var(--on-error-container)'
                    },
                    fontFamily: {
                        sans: ['Roboto', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* ============================================================
       浅色主题（默认）—— 浏览器不支持深浅模式时使用
       ============================================================ */
        :root {
            --primary: #5279FB;
            --on-primary: #FFFFFF;
            --primary-container: #E0E0FC;
            --on-primary-container: #061844;
            --secondary: #5A5C7C;
            --secondary-container: #E0E0FE;
            --on-secondary-container: #151935;
            --tertiary-container: #FFD8E7;
            --on-tertiary-container: #3C0322;
            --surface: #F9F9FF;
            --surface-container-low: #F3F3F9;
            --surface-container: #EDEDF3;
            --surface-container-high: #E8E8ED;
            --surface-container-highest: #E2E2E8;
            --on-surface: #1B1B1F;
            --on-surface-variant: #464651;
            --outline: #767682;
            --outline-variant: #C6C5D2;
            --inverse-surface: #303034;
            --inverse-on-surface: #F0F0F6;
            --inverse-primary: #C0C2FD;
            --error: #B3261E;
            --on-error: #FFFFFF;
            --error-container: #F9DEDC;
            --on-error-container: #410E0B;

            --scrim: rgba(0, 0, 0, .32);
            --shadow-soft: 0 1px 2px rgba(0, 0, 0, .06);
            --shadow-card: 0 1px 2px rgba(0, 0, 0, .06);
            --shadow-dialog: 0 8px 24px rgba(0, 0, 0, .16);
            --shadow-snack: 0 4px 14px rgba(0, 0, 0, .18);
        }

        /* ============================================================
       深色主题 —— 跟随浏览器
       ============================================================ */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #C0C2FD;
                --on-primary: #062C70;
                --primary-container: #07409F;
                --on-primary-container: #E0E0FC;
                --secondary: #C3C3E9;
                --secondary-container: #424463;
                --on-secondary-container: #E0E0FE;
                --tertiary-container: #6E334E;
                --on-tertiary-container: #FFD8E7;
                --surface: #131317;
                --surface-container-low: #1B1B1F;
                --surface-container: #1F1F23;
                --surface-container-high: #2A2A2E;
                --surface-container-highest: #343439;
                --on-surface: #E2E2E8;
                --on-surface-variant: #C6C5D2;
                --outline: #90909C;
                --outline-variant: #464651;
                --inverse-surface: #E2E2E8;
                --inverse-on-surface: #303034;
                --inverse-primary: #3857BA;
                --error: #F2B8B5;
                --on-error: #601410;
                --error-container: #8C1D18;
                --on-error-container: #F9DEDC;

                --scrim: rgba(0, 0, 0, .6);
                --shadow-soft: 0 1px 2px rgba(0, 0, 0, .5);
                --shadow-card: 0 1px 2px rgba(0, 0, 0, .5);
                --shadow-dialog: 0 8px 24px rgba(0, 0, 0, .6);
                --shadow-snack: 0 4px 14px rgba(0, 0, 0, .6);
            }
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--surface);
            font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--on-surface);
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- App shell：全宽自适应 ---------- */
        #app {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 100dvh;
            overflow: hidden;
            background: var(--surface);
        }

        /* ---------- Screens ---------- */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            will-change: transform;
        }

        .screen-scroll {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .image-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            pointer-events: none;
        }

        .screen-scroll::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        /* ---------- App bar ---------- */
        .app-bar {
            flex: 0 0 auto;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 4px;
            background: var(--surface);
            transition: background-color .25s cubic-bezier(.2, 0, 0, 1);
            z-index: 5;
        }

        .app-bar.scrolled {
            background: var(--surface-container);
        }

        .app-bar-title {
            flex: 1 1 auto;
            min-width: 0;
            margin: 0 0 0 8px;
            font-size: 22px;
            line-height: 28px;
            font-weight: 400;
            color: var(--on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-bar-btn,
        .app-bar-icon-static {
            flex: 0 0 48px;
            width: 48px;
            height: 48px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--on-surface-variant);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background-color .2s ease, transform .12s ease;
            font-family: inherit;
        }

        .app-bar-icon-static {
            cursor: default;
        }

        .app-bar-btn:hover {
            background: color-mix(in srgb, currentColor 8%, transparent);
        }

        .app-bar-btn:active {
            transform: scale(.92);
        }

        .app-bar-spacer {
            flex: 0 0 48px;
            width: 48px;
            height: 48px;
        }

        .material-symbols-rounded {
            font-family: 'Material Symbols Rounded';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            -webkit-font-feature-settings: 'liga';
            font-feature-settings: 'liga';
            user-select: none;
        }

        /* ---------- Ripple ---------- */
        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple-wave {
            position: absolute;
            border-radius: 9999px;
            background: currentColor;
            opacity: .12;
            transform: scale(0);
            animation: rippleAnim .55s cubic-bezier(.2, 0, 0, 1) forwards;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            0% {
                transform: scale(0);
                opacity: .14;
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        /* ============================================================
       List —— 左图标 / 靠左文字 / 右箭头，同一行水平排布
       ============================================================ */
        .list-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

        .list-item {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            width: 100%;
            min-height: 72px;
            padding: 12px 16px;
            box-sizing: border-box;
            background: var(--surface-container-low);
            color: var(--on-surface);
            border: none;
            text-align: left;
            font-family: inherit;
            cursor: pointer;
            transition: transform .12s ease, background-color .2s ease;
        }

        .list-item:active {
            transform: scale(.985);
        }

        .list-group>.list-item {
            border-radius: 8px;
        }

        .list-group>.list-item:first-child {
            border-radius: 28px 28px 8px 8px;
        }

        .list-group>.list-item:last-child {
            border-radius: 8px 8px 28px 28px;
        }

        .list-group>.list-item:first-child:last-child {
            border-radius: 28px;
        }

        .list-item-leading {
            flex: 0 0 40px;
            width: 40px;
            height: 40px;
            border-radius: 9999px;
            background: var(--primary-container);
            color: var(--on-primary-container);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            align-self: center;
        }

        .list-item-leading .material-symbols-rounded {
            font-size: 24px;
        }

        .list-item-content {
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 0%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 2px;
        }

        .list-item-title {
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: var(--on-surface);
            width: 100%;
            text-align: left;
        }

        .list-item-sub {
            font-size: 14px;
            line-height: 20px;
            color: var(--on-surface-variant);
            width: 100%;
            text-align: left;
        }

        .list-item-trailing {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            margin-left: auto;
            align-self: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            line-height: 24px;
            color: var(--on-surface-variant);
        }

        .list-item-trailing-text {
            flex: 0 0 auto;
            margin-left: auto;
            align-self: center;
            font-size: 14px;
            line-height: 20px;
            white-space: nowrap;
        }

        /* ---------- Home ---------- */
        .home-body {
            min-height: 100%;
            box-sizing: border-box;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .home-body>.list-group {
            margin: auto 0;
        }

        /* ---------- Doc cards：两列等宽等高 ---------- */
        .doc-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            align-items: stretch;
            grid-auto-rows: minmax(100px, auto);
        }

        .doc-card {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            min-height: 100px;
            padding: 16px;
            border-radius: 20px;
            background: var(--surface-container-highest);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            border: none;
            text-align: left;
            font-family: inherit;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .2s ease;
        }

        .doc-card:active {
            transform: scale(.98);
        }

        .doc-card-title {
            font-size: 16px;
            line-height: 24px;
            font-weight: 500;
            color: var(--on-surface);
            word-break: break-word;
        }

        .doc-card-body {
            font-size: 14px;
            line-height: 20px;
            color: var(--on-surface-variant);
            word-break: break-word;
        }

        .media-card {
            display: block;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: var(--surface-container-highest);
            border: none;
            padding: 0;
            text-align: left;
            font-family: inherit;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: transform .12s ease;
        }

        .media-card:active {
            transform: scale(.985);
        }

        /* ---------- Buttons ---------- */
        .filled-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 48px;
            padding: 0 24px;
            border-radius: 9999px;
            background: var(--primary);
            color: var(--on-primary);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: .1px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: transform .12s ease, box-shadow .2s ease;
        }

        .filled-button:active {
            transform: scale(.98);
        }

        .text-button {
            height: 40px;
            padding: 0 14px;
            border-radius: 9999px;
            background: transparent;
            color: var(--primary);
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background-color .2s ease;
        }

        .text-button:hover {
            background: color-mix(in srgb, currentColor 8%, transparent);
        }

        .text-button.danger {
            color: var(--error);
        }

        /* ---------- Dialog ---------- */
        .dialog-scrim {
            position: absolute;
            inset: 0;
            z-index: 120;
            background: var(--scrim);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s cubic-bezier(.2, 0, 0, 1);
        }

        .dialog-scrim.open {
            opacity: 1;
            pointer-events: auto;
        }

        .dialog {
            width: 100%;
            max-width: 312px;
            box-sizing: border-box;
            padding: 24px;
            border-radius: 28px;
            background: var(--surface-container-high);
            color: var(--on-surface);
            transform: scale(.9);
            transition: transform .22s cubic-bezier(.2, 0, 0, 1);
            box-shadow: var(--shadow-dialog);
        }

        .dialog-scrim.open .dialog {
            transform: scale(1);
        }

        .dialog-title {
            margin: 0 0 12px;
            font-size: 22px;
            line-height: 28px;
            font-weight: 400;
        }

        .dialog-text {
            margin: 0;
            font-size: 14px;
            line-height: 20px;
            color: var(--on-surface-variant);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        /* ---------- Snackbar ---------- */
        .snackbar {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 16px;
            z-index: 200;
            padding: 14px 16px;
            border-radius: 12px;
            background: var(--inverse-surface);
            color: var(--inverse-on-surface);
            font-size: 14px;
            line-height: 20px;
            transform: translateY(220%);
            transition: transform .3s cubic-bezier(.2, 0, 0, 1);
            pointer-events: none;
            box-shadow: var(--shadow-snack);
        }

        .snackbar.show {
            transform: translateY(0);
        }

        /* ---------- Service status ---------- */
        .service-item {
            cursor: default;
        }

        .service-item:active {
            transform: none;
        }

        /* ---------- Embedded page ---------- */
        .embed-wrap {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--surface-container-low);
        }

        .embed-frame {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            border: 0;
            display: block;
            background: var(--surface);
        }

        .embed-foot {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-top: 1px solid var(--outline-variant);
            background: var(--surface-container-low);
        }

        .img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-container-highest);
            color: var(--outline);
        }
    </style>
</head>

<body>

    <div id="app">

        <!-- ==================== 首页 ==================== -->
        <section class="screen" data-screen="home">
            <header class="app-bar">
                <span class="app-bar-icon-static" aria-hidden="true">
                    <span class="material-symbols-rounded">volunteer_activism</span>
                </span>
                <h1 class="app-bar-title">Vilinko Studio 服务中心</h1>
            </header>

            <div class="screen-scroll">
                <div class="home-body">
                    <nav class="list-group">
                        <button class="list-item ripple" data-nav="docs">
                            <span class="list-item-leading"><span
                                    class="material-symbols-rounded">description</span></span>
                            <span class="list-item-content">
                                <span class="list-item-title">文档</span>
                                <span class="list-item-sub">查阅产品介绍、使用说明和服务政策</span>
                            </span>
                        </button>

                        <button class="list-item ripple" data-nav="dev">
                            <span class="list-item-leading"><span class="material-symbols-rounded">bolt</span></span>
                            <span class="list-item-content">
                                <span class="list-item-title">开发者服务</span>
                                <span class="list-item-sub">轻量、多元、开放、感知</span>
                            </span>
                        </button>

                        <button class="list-item ripple" data-nav="feedback">
                            <span class="list-item-leading"><span
                                    class="material-symbols-rounded">feedback</span></span>
                            <span class="list-item-content">
                                <span class="list-item-title">产品反馈</span>
                                <span class="list-item-sub">反馈产品问题</span>
                            </span>
                        </button>

                        <button class="list-item ripple" data-nav="status">
                            <span class="list-item-leading"><span class="material-symbols-rounded">host</span></span>
                            <span class="list-item-content">
                                <span class="list-item-title">服务状态</span>
                                <span class="list-item-sub">查询 Vilinko 站点和程序服务的可达性状态</span>
                            </span>
                        </button>

                        <button class="list-item ripple" data-dialog="aboutDialog">
                            <span class="list-item-leading"><span class="material-symbols-rounded">info</span></span>
                            <span class="list-item-content">
                                <span class="list-item-title">关于</span>
                                <span class="list-item-sub">Version: 0.0.1-Alpha</span>
                            </span>
                        </button>
                    </nav>
                </div>
            </div>
        </section>

        <!-- ==================== 文档-产品 ==================== -->
        <section class="screen" data-screen="docs">
            <header class="app-bar">
                <button class="app-bar-btn ripple" data-back aria-label="返回">
                    <span class="material-symbols-rounded">arrow_back</span>
                </button>
                <h1 class="app-bar-title">文档</h1>
                <div class="app-bar-spacer"></div>
            </header>

            <div class="screen-scroll">
                <div class="px-4 py-3 doc-grid">

                    <button class="doc-card ripple" data-link="https://docs.vilinko.com/docs/lightframe/">
                        <div class="doc-card-title">LightFrame</div>
                        <div class="doc-card-body">桌面优化应用程序。</div>
                    </button>

                    <button class="doc-card ripple" data-link="https://docs.vilinko.com/docs/lightframe/">
                        <div class="doc-card-title">LightFrame 2.0</div>
                        <div class="doc-card-body">桌面优化应用程序，此文档供测试版使用。</div>
                    </button>

                    <button class="doc-card ripple" data-link="https://docs.vilinko.com/docs/pogget/">
                        <div class="doc-card-title">Pogget</div>
                        <div class="doc-card-body">文件管理和交互工具。</div>
                    </button>

                    <button class="doc-card ripple" data-link="https://docs.vilinko.com/docs/vui.parser/">
                        <div class="doc-card-title">Vui.Parser</div>
                        <div class="doc-card-body">简易轻量的数据解析器。</div>
                    </button>

                    <button class="doc-card ripple" data-link="https://docs.vilinko.com/docs/universe/">
                        <div class="doc-card-title">Universe</div>
                        <div class="doc-card-body">产品统一更新器。</div>
                    </button>

                    <button class="doc-card ripple" data-link="https://docs.vilinko.com/docs/synap/">
                        <div class="doc-card-title">Synap</div>
                        <div class="doc-card-body">极简的及时性笔记工具。</div>
                    </button>

                    <button class="doc-card ripple" data-link="https://docs.vilinko.com/agreement/tos.html">
                        <div class="doc-card-title">服务条款</div>
                        <div class="doc-card-body">使用我们的服务代表您同意此条款。</div>
                    </button>

                    <button class="doc-card ripple" data-link="https://docs.vilinko.com/agreement/privacy.html">
                        <div class="doc-card-title">隐私政策</div>
                        <div class="doc-card-body">告知您我们如何使用和保存您的信息。</div>

    <script>
            (function () {
                'use strict';

                /* ============================================================
                   Screen registry
                   ============================================================ */
                const screenEls = new Map();
                document.querySelectorAll('.screen').forEach(function (el) {
                    screenEls.set(el.dataset.screen, el);
                    el.style.transform = el.dataset.screen === 'home' ? 'translateX(0)' : 'translateX(100%)';
                    el.style.zIndex = el.dataset.screen === 'home' ? '2' : '1';
                });

                const TRANSITION = 'transform 350ms cubic-bezier(0.2, 0, 0, 1)';
                const HOME_ID = 'home';
                const BASE_PATH = location.pathname;

                let stack = [HOME_ID];

                /* ============================================================
                   URL helpers —— ?page=xxx 与 ?back=true|false 组合
                   ============================================================ */
                function urlFor(screenId, backVisible) {
                    const params = new URLSearchParams();
                    if (screenId !== HOME_ID) {
                        params.set('page', screenId);
                    }
                    if (backVisible === false) {
                        params.set('back', 'false');
                    }
                    const qs = params.toString();
                    return qs ? (BASE_PATH + '?' + qs) : BASE_PATH;
                }

                function stateFromUrl() {
                    const params = new URLSearchParams(location.search);
                    const slug = params.get('page');
                    const backParam = params.get('back');
                    return {
                        page: (slug && screenEls.has(slug)) ? slug : HOME_ID,
                        back: backParam !== 'false'
                    };
                }

                function currentId() {
                    return stack[stack.length - 1];
                }

                /* ============================================================
                   返回箭头可见性
                   ============================================================ */
                function setBackButtonVisible(screenId, visible) {
                    const screen = screenEls.get(screenId);
                    if (!screen) return;
                    const btn = screen.querySelector('[data-back]');
                    if (!btn) return;
                    btn.style.display = visible ? '' : 'none';
                }

                /* ============================================================
                   Transition helper
                   ============================================================ */
                function performTransition(fromId, toId, direction) {
                    const from = screenEls.get(fromId);
                    const to = screenEls.get(toId);
                    if (!from || !to || from === to) return;

                    const startX = direction === 'back' ? '-100%' : '100%';
                    const endX = direction === 'back' ? '100%' : '-100%';

                    to.style.transition = 'none';
                    to.style.transform = 'translateX(' + startX + ')';
                    to.style.zIndex = '3';
                    from.style.zIndex = '2';
                    void to.offsetWidth;

                    to.style.transition = TRANSITION;
                    from.style.transition = TRANSITION;
                    to.style.transform = 'translateX(0)';
                    from.style.transform = 'translateX(' + endX + ')';
                }

                /* ============================================================
                   Navigation
                   ============================================================ */
                function navigateForward(id) {
                    if (!screenEls.has(id)) return;
                    if (currentId() === id) return;

                    const fromId = currentId();
                    performTransition(fromId, id, 'forward');
                    stack.push(id);

                    // 向前导航的新页面总是可以返回
                    try {
                        history.pushState({ page: id, depth: stack.length, back: true }, '', urlFor(id, true));
                    } catch (e) { }

                    setBackButtonVisible(id, true);
                    onScreenShown(id);
                }

                function navigateBack() {
                    if (stack.length <= 1) return;
                    try {
                        history.back();
                    } catch (e) {
                        popToStackIndex(stack.length - 2, true);
                    }
                }

                function popToStackIndex(idx, backVisible) {
                    if (idx < 0 || idx >= stack.length - 1) return;
                    const fromId = currentId();
                    const toId = stack[idx];
                    performTransition(fromId, toId, 'back');
                    stack = stack.slice(0, idx + 1);
                    setBackButtonVisible(toId, backVisible !== false);
                    onScreenShown(toId);
                }

                /* ============================================================
                   Init history & restore screen from URL
                   ============================================================ */
                (function initHistory() {
                    const initial = stateFromUrl();
                    const initialPage = initial.page;
                    const initialBack = initial.back;

                    if (initialPage === HOME_ID) {
                        try {
                            history.replaceState({ page: HOME_ID, depth: 1, back: true }, '', urlFor(HOME_ID, true));
                        } catch (e) { }
                        stack = [HOME_ID];
                        setBackButtonVisible(HOME_ID, true);
                        onScreenShown(HOME_ID);
                        return;
                    }

                    if (initialBack === false) {
                        // 独立模式：历史栈中只有该子页面（浏览器返回将离开本站）
                        try {
                            history.replaceState({ page: initialPage, depth: 1, back: false }, '', urlFor(initialPage, false));
                        } catch (e) { }
                        stack = [initialPage];
                    } else {
                        // 常规模式：首页在下一层，子页面之上
                        try {
                            history.replaceState({ page: HOME_ID, depth: 1, back: true }, '', urlFor(HOME_ID, true));
                            history.pushState({ page: initialPage, depth: 2, back: true }, '', urlFor(initialPage, true));
                        } catch (e) { }
                        stack = [HOME_ID, initialPage];
                    }

                    const to = screenEls.get(initialPage);
                    if (to) {
                        to.style.transition = 'none';
                        to.style.transform = 'translateX(0)';
                        to.style.zIndex = '3';
                    }

                    setBackButtonVisible(initialPage, initialBack);
                    onScreenShown(initialPage);
                })();

                /* ============================================================
                   popstate —— 浏览器返回 / 前进
                   ============================================================ */
                window.addEventListener('popstate', function () {
                    const state = stateFromUrl();
                    const targetId = state.page;

                    if (targetId === currentId()) {
                        // 页面没变，仅 back 可见性变化
                        setBackButtonVisible(targetId, state.back);
                        return;
                    }

                    const idx = stack.lastIndexOf(targetId);

                    if (idx >= 0 && idx < stack.length - 1) {
                        popToStackIndex(idx, state.back);
                    } else {
                        const fromId = currentId();
                        performTransition(fromId, targetId, 'forward');
                        stack.push(targetId);
                        setBackButtonVisible(targetId, state.back);
                        onScreenShown(targetId);
                    }
                });

                /* ============================================================
                   onScreenShown
                   ============================================================ */
                function onScreenShown(id) {
                    if (id === 'status') runStatusCheck();
                }

                /* ============================================================
                   Ripple
                   ============================================================ */
                document.addEventListener('pointerdown', function (e) {
                    const el = e.target.closest('.ripple');
                    if (!el) return;
                    const rect = el.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height) * 2.2;
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    const wave = document.createElement('span');
                    wave.className = 'ripple-wave';
                    wave.style.width = size + 'px';
                    wave.style.height = size + 'px';
                    wave.style.left = x + 'px';
                    wave.style.top = y + 'px';
                    el.appendChild(wave);
                    window.setTimeout(function () {
                        if (wave.parentNode) wave.parentNode.removeChild(wave);
                    }, 600);
                }, { passive: true });

                /* ============================================================
                   Snackbar
                   ============================================================ */
                let snackTimer = null;
                const snackEl = document.getElementById('snackbar');
                function showSnack(msg) {
                    snackEl.textContent = msg;
                    snackEl.classList.add('show');
                    window.clearTimeout(snackTimer);
                    snackTimer = window.setTimeout(function () {
                        snackEl.classList.remove('show');
                    }, 2600);
                }

                /* ============================================================
                   Dialogs
                   ============================================================ */
                function openDialog(id) {
                    const el = document.getElementById(id);
                    if (el) el.classList.add('open');
                }
                function closeDialog(el) {
                    if (el) el.classList.remove('open');
                }
                document.querySelectorAll('.dialog-scrim').forEach(function (scrim) {
                    scrim.addEventListener('click', function (e) {
                        if (e.target === scrim) closeDialog(scrim);
                    });
                });

                /* ============================================================
                   Global click delegation
                   ============================================================ */
                document.addEventListener('click', function (e) {
                    const navEl = e.target.closest('[data-nav]');
                    if (navEl) {
                        navigateForward(navEl.dataset.nav);
                        return;
                    }

                    const backEl = e.target.closest('[data-back]');
                    if (backEl) {
                        navigateBack();
                        return;
                    }

                    const closeEl = e.target.closest('[data-dialog-close]');
                    if (closeEl) {
                        closeDialog(closeEl.closest('.dialog-scrim'));
                        return;
                    }

                    const linkEl = e.target.closest('[data-link]');
                    if (linkEl) {
                        window.open(linkEl.dataset.link, '_blank', 'noopener,noreferrer');
                        return;
                    }

                    const dlgEl = e.target.closest('[data-dialog]');
                    if (dlgEl) {
                        openDialog(dlgEl.dataset.dialog);
                        return;
                    }
                });

                /* ============================================================
                   App bar scroll elevation
                   ============================================================ */
                document.querySelectorAll('.screen-scroll').forEach(function (scroller) {
                    const screen = scroller.closest('.screen');
                    const bar = screen.querySelector('.app-bar');
                    if (!bar) return;
                    scroller.addEventListener('scroll', function () {
                        bar.classList.toggle('scrolled', scroller.scrollTop > 4);
                    }, { passive: true });
                });

                /* ============================================================
                   Service status screen
                   ============================================================ */
                const SERVICES = [
                    { id: 'www', name: 'Vilinko 主站', desc: 'www.vilinko.com', url: 'https://www.vilinko.com/' },
                    { id: 'docs', name: '文档中心', desc: 'docs.vilinko.com', url: 'https://docs.vilinko.com/' },
                    { id: 'support', name: '支持中心', desc: 'support.vilinko.com', url: 'https://support.vilinko.com/' }
                ];

                let statusRunning = false;
                let statusResults = {};

                function renderServiceList() {
                    const list = document.getElementById('serviceList');
                    if (!list) return;
                    list.innerHTML = SERVICES.map(function (s) {
                        const r = statusResults[s.id] || 'checking';
                        const label = r === 'ok' ? '正常' : (r === 'fail' ? '不可达' : '检测中');
                        const colorClass = r === 'ok' ? 'text-primary' : (r === 'fail' ? 'text-error' : 'text-on-surface-variant');
                        return '' +
                            '<div class="list-item service-item">' +
                            '<span class="list-item-content">' +
                            '<span class="list-item-title">' + s.name + '</span>' +
                            '<span class="list-item-sub">' + s.desc + '</span>' +
                            '</span>' +
                            '<span class="list-item-trailing-text ' + colorClass + '">' + label + '</span>' +
                            '</div>';
                    }).join('');
                }

                function updateNetworkSummary() {
                    const online = navigator.onLine;
                    const labelEl = document.getElementById('netLabel');
                    const detailEl = document.getElementById('netDetail');
                    if (!labelEl || !detailEl) return;
                    labelEl.textContent = online ? '网络连接正常' : '网络已断开';
                    detailEl.textContent = online ? '浏览器处于在线状态' : '请检查您的网络设置后重试';
                }

                window.addEventListener('online', updateNetworkSummary);
                window.addEventListener('offline', updateNetworkSummary);

                function checkService(url) {
                    return new Promise(function (resolve) {
                        if (!navigator.onLine) { resolve('fail'); return; }
                        const controller = ('AbortController' in window) ? new AbortController() : null;
                        const timer = window.setTimeout(function () {
                            if (controller) controller.abort();
                            resolve('fail');
                        }, 8000);

                        fetch(url, {
                            mode: 'no-cors',
                            cache: 'no-store',
                            signal: controller ? controller.signal : undefined
                        }).then(function () {
                            window.clearTimeout(timer);
                            resolve('ok');
                        }).catch(function () {
                            window.clearTimeout(timer);
                            resolve('fail');
                        });
                    });
                }

                function runStatusCheck() {
                    if (statusRunning) return;
                    statusRunning = true;

                    statusResults = {};
                    SERVICES.forEach(function (s) { statusResults[s.id] = 'checking'; });
                    renderServiceList();
                    updateNetworkSummary();

                    const lastEl = document.getElementById('lastChecked');
                    if (lastEl) lastEl.textContent = '正在检测…';

                    const tasks = SERVICES.map(function (s) {
                        return checkService(s.url).then(function (r) {
                            statusResults[s.id] = r;
                            renderServiceList();
                        });
                    });

                    Promise.all(tasks).then(function () {
                        statusRunning = false;
                        if (lastEl) {
                            const t = new Date();
                            const pad = function (n) { return n < 10 ? '0' + n : '' + n; };
                            lastEl.textContent = '最后检测：' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds());
                        }
                    });
                }

                const refreshBtn = document.getElementById('refreshStatus');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', function () {
                        runStatusCheck();
                    });
                }

                /* ============================================================
                   Boot
                   ============================================================ */
                updateNetworkSummary();
                renderServiceList();
            })();
    </script>
</body>

</html>
